[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epuboverlay"
version = "0.11.0"
description = "Generate standard narrated EPUB 3 files with Media Overlays using F5-TTS, Kokoro-82M, Pocket-TTS, Qwen3-TTS, CosyVoice2, and Fish-Speech, and extract audio & subtitles."
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "psutil>=5.9.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
# Document format converters
docx = ["python-docx"]
pdf = ["pypdf"]
docs = ["python-docx", "pypdf"]

# TTS engines
kokoro = ["kokoro>=0.7.16"]
pocket = [
    "pocket-tts>=0.1.0",
    "scipy>=1.10.0",
]
f5 = ["f5-tts>=1.1.0"]
f5-tts = ["f5-tts>=1.1.0"]
qwen = [
    "qwen-tts>=0.1.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
qwen3-tts = [
    "qwen-tts>=0.1.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
cosyvoice = [
    "modelscope>=1.15.0",
    "diffusers<=0.31.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
cosyvoice2 = [
    "modelscope>=1.15.0",
    "diffusers<=0.31.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
fish = [
    "fish-audio-sdk>=1.0.0",
    "ormsgpack>=1.2.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
fish-speech = [
    "fish-audio-sdk>=1.0.0",
    "ormsgpack>=1.2.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]

# Installation tiers:
# Minimal: base dependencies only (web app, CLI, dummy testing, EPUB/TXT/MD)
# Standard: lightweight neural TTS (Kokoro + PocketTTS) + PDF & DOCX
standard = [
    "kokoro>=0.7.16",
    "pocket-tts>=0.1.0",
    "scipy>=1.10.0",
    "python-docx",
    "pypdf",
]
# Multilingual: emotional & multilingual TTS engines (Qwen3-TTS, CosyVoice2, Fish-Speech)
multilingual = [
    "qwen-tts>=0.1.0",
    "modelscope>=1.15.0",
    "diffusers<=0.31.0",
    "fish-audio-sdk>=1.0.0",
    "ormsgpack>=1.2.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
]
# Full: everything including heavy F5-TTS and multilingual voice cloning
full = [
    "kokoro>=0.7.16",
    "pocket-tts>=0.1.0",
    "scipy>=1.10.0",
    "f5-tts>=1.1.0",
    "qwen-tts>=0.1.0",
    "modelscope>=1.15.0",
    "diffusers<=0.31.0",
    "fish-audio-sdk>=1.0.0",
    "ormsgpack>=1.2.0",
    "soundfile>=0.12.1",
    "python-docx",
    "pypdf",
]
all = [
    "kokoro>=0.7.16",
    "pocket-tts>=0.1.0",
    "scipy>=1.10.0",
    "f5-tts>=1.1.0",
    "qwen-tts>=0.1.0",
    "modelscope>=1.15.0",
    "diffusers<=0.31.0",
    "fish-audio-sdk>=1.0.0",
    "ormsgpack>=1.2.0",
    "soundfile>=0.12.1",
    "python-docx",
    "pypdf",
]

[project.scripts]
epuboverlay = "epuboverlay.cli:main"
epuboverlay-web = "epuboverlay.web.server:main"

[tool.setuptools.packages.find]
include = ["epuboverlay*"]
